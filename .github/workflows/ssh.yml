name: SSH TUNNEL

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings

          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null

          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list

          sudo apt-get update
          sudo apt-get install -y cloudflared

      - name: Run Cloudflare Tunnel
        run: |
          cloudflared tunnel run --token "eyJhIjoiOWFiOGY0ODFkZjI2M2Y3NjM1YzZmZTkxODM5ZmIxZDQiLCJ0IjoiMmQ3NzJkYjYtMDk0NC00MThkLWI0NGMtNmMzN2VmZTI2MjQ1IiwicyI6Ik0yVTBPR1kzTVdNdE1qTmpPUzAwTmpNNUxUaGhZbUl0TldNNE9EQXhZVFZqTVdNeiJ9" &

          sleep 15

          echo "Tunnel started"
      - name: Install SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

      - name: Set SSH Password Authentication and Start Service
        run: |
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo useradd -m -s /bin/bash aryan
          echo 'aryan:Am11338833' | sudo chpasswd
          sudo mkdir -p /var/run/sshd
          sudo /usr/sbin/sshd -D &

      - name: Print SSH Server Status
        run: ps aux | grep sshd
      
      - name: Keep workflow alive
        run: sleep 3600
